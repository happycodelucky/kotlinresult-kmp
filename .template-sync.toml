# Template sync state — maintained with the paul-template-sync skill.
#
# last_synced is the template commit this repo has been reconciled against: every template
# change up to it was adopted, adapted, or deliberately skipped (see [[decision]] / [[ignore]]).
# Advance it only with `template_sync.py record`, in the same PR that lands the sync.

[template]
repo = "https://github.com/happycodelucky/kmp-template"
branch = "main"
last_synced = "3c348be806dced96c5d5a98809f73ff9d8f82f2b"
last_synced_date = "2026-09-27"

# Render map: how template paths and text read in this repo. Generated from the template's
# scripts/init.sh rules; edit it where this repo deliberately differs. Replacements are
# literal and applied in order; path rules are regexes applied in order.
[render]
name = "kotlinresult"
display_name = "KotlinResult"
framework = "KotlinresultKit"
group = "com.happycodelucky"
org = "happycodelucky"
repo_name = "kotlinresult-kmp"

[[render.replace]]
from = "github.com/happycodelucky/__PROJECT_NAME__"
to = "github.com/happycodelucky/kotlinresult-kmp"

# Pre-f5418f5 template text spelled the GitHub repo as __PROJECT_NAME__; this repo is
# kotlinresult-kmp (268e4f2). The Maven path com/happycodelucky/kotlinresult is untouched.
[[render.replace]]
from = "happycodelucky.github.io/__PROJECT_NAME__"
to = "happycodelucky.github.io/kotlinresult-kmp"

[[render.replace]]
from = "repo_name: happycodelucky/__PROJECT_NAME__"
to = "repo_name: happycodelucky/kotlinresult-kmp"

[[render.replace]]
from = "__PROJECT_NAME__"
to = "kotlinresult"

[[render.replace]]
from = "__DISPLAY_NAME__"
to = "KotlinResult"

[[render.replace]]
from = "__FRAMEWORK__"
to = "KotlinresultKit"

[[render.replace]]
from = "__REPO__"
to = "kotlinresult-kmp"

[[render.replace]]
from = "template.kmp-library"
to = "kotlinresult.kmp-library"

[[render.replace]]
from = "template.publish"
to = "kotlinresult.publish"

[[render.replace]]
from = "LIBRARY_VERSION"
to = "KOTLINRESULT_VERSION"

[[render.replace]]
from = "com.happycodelucky.src.testing"
to = "com.happycodelucky.kotlinresult.testing"

[[render.replace]]
from = "com.happycodelucky.src.example"
to = "com.happycodelucky.kotlinresult.example"

[[render.replace]]
from = "com.happycodelucky.src.cli"
to = "com.happycodelucky.kotlinresult.cli"

[[render.replace]]
from = "com.happycodelucky.src"
to = "com.happycodelucky.kotlinresult"

[[render.replace]]
from = "build:src"
to = "build@@SRCTASK@@"

[[render.replace]]
from = ":src-testing"
to = ":kotlinresult-testing"

[[render.replace]]
from = ":src"
to = ":kotlinresult"

[[render.replace]]
from = "build@@SRCTASK@@"
to = "build:src"

[[render.replace]]
from = "assembleSrcKitXCFramework"
to = "assembleKotlinresultKitXCFramework"

[[render.replace]]
from = "src-testing/build"
to = "kotlinresult-testing/build"

[[render.replace]]
from = "src-testing/api"
to = "kotlinresult-testing/api"

[[render.replace]]
from = "src/build"
to = "kotlinresult/build"

[[render.replace]]
from = "src/api"
to = "kotlinresult/api"

[[render.replace]]
from = "if-no-files-found: warn"
to = "if-no-files-found: error"

[[render.path]]
from = "^src-testing/"
to = "kotlinresult-testing/"

[[render.path]]
from = "^src/"
to = "kotlinresult/"

[[render.path]]
from = "/com/happycodelucky/src(/|$)"
to = "/com/happycodelucky/kotlinresult\\1"

[[render.path]]
from = "^gradle/plugins/src/main/kotlin/template\\."
to = "gradle/plugins/src/main/kotlin/kotlinresult."

# Standing decisions: template paths this repo deliberately does not carry.
[[ignore]]
path = "TEMPLATE.md"
reason = "Template scaffolding, removed at render."

[[ignore]]
path = "scripts/init.sh"
reason = "Template scaffolding, removed at render."

[[ignore]]
path = "scripts/template-manifest.txt"
reason = "Template scaffolding, removed at render."

[[ignore]]
path = "src/src/*"
reason = "Template placeholder API (Greeter); :kotlinresult carries Result instead."

[[ignore]]
path = "src/api/*"
reason = "Template placeholder API dumps; this repo commits its own."

[[ignore]]
path = "src-testing/src/*"
reason = "Template placeholder test helpers; :kotlinresult-testing carries assertSuccess/assertFailure."

# Per-change decisions (append one per template change triaged; `deferred` resurfaces in
# `status`). status: adopted | adapted | skipped | deferred.
# [[decision]]
# change = "e2737c2 Drive releases from changesets and a rolling release PR"
# status = "adopted"
# reason = "…"

