# kotlinresult — macOSApp sample (Xcode project spec for `xcodegen`).
#
# Run `mise run xcodeproj:macos` (or `xcodegen generate` here) to emit
# macOSApp.xcodeproj. The .xcodeproj is gitignored — the spec is the source of
# truth. Same local-SPM iteration loop as the iOS sample (`mise run spm:dev`).
#
# macOS is the easiest Apple target to run/verify: no simulator/device. The
# package name KotlinresultKit matches the XCFramework's Swift module name.

name: macOSApp

options:
  bundleIdPrefix: com.happycodelucky.kotlinresult.example
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  KotlinresultKit:
    path: ../../

targets:
  macOSApp:
    type: application
    platform: macOS
    sources:
      - path: macOSApp
      - path: ../shared
    info:
      path: macOSApp/Info.plist
      properties:
        CFBundleDisplayName: KotlinResult
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.happycodelucky.kotlinresult.example.macos
        PRODUCT_NAME: "KotlinResult"
        SWIFT_VERSION: "5.10"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_ENTITLEMENTS: macOSApp/macOSApp.entitlements
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: KotlinresultKit
